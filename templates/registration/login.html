<!-- templates/registration/login.html -->
{% extends 'base.html' %}

{% block content %}
<h2>Iniciar sesión en Congreso</h2>

{% if form.errors %}
    <p style="color: red;">Tu usuario o contraseña no coinciden. Inténtalo de nuevo.</p>
{% endif %}

<form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    
    <div>
        <label for="{{ form.username.id_for_label }}">Usuario:</label>
        {{ form.username }}
    </div>

    <div>
        <label for="{{ form.password.id_for_label }}">Contraseña:</label>
        {{ form.password }}
    </div>

    <!-- Mantiene la redirección si el usuario venía de una página protegida -->
    <input type="hidden" name="next" value="{{ next }}">
    
    <button type="submit">Entrar</button>
</form>
{% endblock %}
